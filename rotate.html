<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Elementarium</title>
  <!-- The game turned a quarter round, for a phone held sideways whose screen won't turn by itself
       (an iPhone, or any phone with rotation locked). The game runs in the frame; its own turn
       button brings you back to the upright page. Held sideways with rotation on, nothing is turned. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05080a; }
    iframe { position: fixed; top: 0; left: 0; border: 0; width: 100vw; height: 100vh; height: 100dvh; }
    @media (orientation: portrait) {
      iframe {
        width: 100vh; width: 100dvh; height: 100vw;
        transform-origin: top left; transform: translateX(100vw) rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <iframe src="index.html?rotated=1" title="Elementarium" allow="fullscreen" allowfullscreen></iframe>
</body>
</html>
